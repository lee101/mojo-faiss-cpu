[project]
name = "mojo-faiss-cpu"
version = "0.1.0"
description = "Flat, IVF, and PQ vector search indexes implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "faiss", "vector-search", "nearest-neighbor"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "faiss-cpu"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
